<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>存下你的喜爱 · 本地收藏资料库</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <a class="brand" href="#collection" aria-label="存下你的喜爱，返回我的收藏">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span class="brand-copy"><strong>存下你的喜爱</strong><small>LOCAL FAVORITES</small></span>
    </a>
    <nav class="side-nav" aria-label="主要导航">
      <a class="side-nav-item is-active" href="#collection"><span aria-hidden="true">▦</span>我的收藏</a>
      <a class="side-nav-item" href="#sync-section"><span aria-hidden="true">↻</span>同步状态</a>
      <button id="tag-manager-open" class="side-nav-item" type="button"><span aria-hidden="true">#</span>标签管理</button>
    </nav>
    <div class="library-status"><span aria-hidden="true"></span>本地资料库</div>
  </aside>

  <main class="main-content">
    <header class="hero">
      <div class="hero-copy">
        <span class="hero-kicker">PERSONAL CONTENT ARCHIVE</span>
        <h1>喜欢过的内容，值得被找回。</h1>
        <p>把 X 上稍纵即逝的喜欢，沉淀为可搜索、可筛选、可长期保存的本地内容库。</p>
      </div>
      <button id="refresh" class="primary-action" type="button"><span aria-hidden="true">↻</span>刷新归档</button>
    </header>

    <section class="summary-strip" aria-label="归档概览">
      <div class="summary-item"><span>已归档内容</span><strong id="hero-posts-total">0</strong></div>
      <div class="summary-item"><span>收藏的作者</span><strong id="hero-authors-total">0</strong></div>
      <div class="summary-item"><span>同步状态</span><strong id="hero-sync-state">读取中</strong></div>
    </section>

    <form id="filters" aria-label="收藏筛选">
      <label class="search-field"><span class="sr-only">搜索</span><input id="q" placeholder="搜索文字、作者或关键词"></label>
      <label><span class="sr-only">作者</span><input id="author" placeholder="所有作者"></label>
      <label><span class="sr-only">媒体类型</span><select id="media"><option value="">所有媒体</option><option value="image">图片</option><option value="video">视频</option><option value="text">纯文本</option></select></label>
      <label><span class="sr-only">标签</span><select id="tag-filter" aria-label="标签筛选"><option value="">全部标签</option></select></label>
      <label class="filter-date"><span>起始日期</span><span class="date-control"><input id="from" type="date" aria-label="起始日期"><span class="date-placeholder" aria-hidden="true">年/月/日</span></span></label>
      <label class="filter-date"><span>截至日期</span><span class="date-control"><input id="to" type="date" aria-label="截至日期"><span class="date-placeholder" aria-hidden="true">年/月/日</span></span></label>
      <label><span class="sr-only">排序字段</span><select id="sort"><option value="published_at">发布时间</option><option value="collected_at">收藏时间</option><option value="author">作者名称</option></select></label>
      <label><span class="sr-only">排序方向</span><select id="direction" aria-label="排序方向"><option value="desc">降序</option><option value="asc">升序</option></select></label>
      <button type="submit">筛选</button>
    </form>

    <section id="sync-section" class="sync-section" aria-labelledby="sync-title">
      <div class="section-heading">
        <div><span class="section-kicker">Chrome 扩展同步</span><h2 id="sync-title">同步状态</h2></div>
        <div id="status" role="status"></div>
      </div>
      <div class="progress-area" aria-label="归档进度">
        <div class="progress-row">
          <div class="progress-heading"><span>Likes 同步</span><span id="sync-progress-label">等待状态</span></div>
          <progress id="sync-progress" max="100" value="0"></progress>
        </div>
        <div class="progress-row">
          <div class="progress-heading"><span>媒体下载</span><span id="media-progress-label">0 / 0</span></div>
          <progress id="media-progress" max="100" value="0"></progress>
        </div>
        <div class="archive-location"><span>本地存储</span><code id="archive-path">正在读取…</code></div>
      </div>
    </section>

    <section id="collection" class="collection-section" aria-labelledby="collection-title">
      <div class="collection-heading">
        <h2 id="collection-title">全部收藏 <span id="summary">0 条</span></h2>
        <label class="page-size-control">每页
          <select id="page-size"><option value="20">20 条</option><option value="50">50 条</option><option value="100">100 条</option></select>
        </label>
      </div>
      <section id="posts" aria-live="polite"></section>
      <nav class="pagination" aria-label="推文分页">
        <div class="page-nav">
          <button id="prev-page" class="secondary page-button" type="button" aria-label="上一页" title="上一页">‹</button>
          <span id="page-info">第 1 / 1 页 · 共 0 条</span>
          <button id="next-page" class="secondary page-button" type="button" aria-label="下一页" title="下一页">›</button>
          <label class="page-jump">前往第 <input id="page-number" type="number" min="1" value="1" inputmode="numeric" aria-label="页码"> 页</label>
          <button id="jump-page" class="secondary" type="button">跳转</button>
        </div>
      </nav>
    </section>
  </main>
</div>

<dialog id="tag-dialog" aria-labelledby="tag-dialog-title">
  <div class="dialog-head"><h2 id="tag-dialog-title">标签管理</h2><button id="tag-dialog-close" class="icon-button secondary" type="button" aria-label="关闭" title="关闭">×</button></div>
  <form id="tag-form" class="tag-create-form">
    <input id="tag-name" maxlength="40" required placeholder="新标签名称" aria-label="新标签名称">
    <input id="tag-color" type="color" value="#176b53" aria-label="标签颜色">
    <button type="submit">新建标签</button>
  </form>
  <div id="tag-message" role="status"></div>
  <div id="tag-list" class="tag-list"></div>
</dialog>

<dialog id="image-viewer" aria-labelledby="viewer-title">
  <div class="viewer-shell">
    <div class="viewer-toolbar">
      <span id="viewer-title">图片预览</span>
      <div class="viewer-actions">
        <button id="viewer-zoom-out" class="secondary icon-button" type="button" aria-label="缩小" title="缩小">−</button>
        <button id="viewer-zoom-in" class="secondary icon-button" type="button" aria-label="放大" title="放大">＋</button>
        <button id="viewer-rotate-left" class="secondary icon-button" type="button" aria-label="向左旋转" title="向左旋转">↶</button>
        <button id="viewer-rotate-right" class="secondary icon-button" type="button" aria-label="向右旋转" title="向右旋转">↷</button>
        <button id="viewer-reset" class="secondary icon-button" type="button" aria-label="重置视图" title="重置视图">⌖</button>
        <button id="viewer-close" class="secondary icon-button" type="button" aria-label="关闭图片预览" title="关闭图片预览">×</button>
      </div>
    </div>
    <div class="viewer-stage">
      <button id="viewer-prev" class="viewer-nav secondary" type="button" aria-label="上一张" title="上一张">‹</button>
      <div id="viewer-canvas" class="viewer-canvas"><img id="viewer-image" draggable="false" alt=""></div>
      <button id="viewer-next" class="viewer-nav secondary" type="button" aria-label="下一张" title="下一张">›</button>
    </div>
    <div id="viewer-caption" class="viewer-caption"></div>
  </div>
</dialog>
<script src="/assets/app.js"></script>
</body>
</html>
